name: CI/CD Pipeline a Producción

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag y Push de imágenes
        run: |
          SERVICES=("ms-academico" "ms-asistencia" "ms-comunicaciones" "bff-service" "frontend")
          for service in "${SERVICES[@]}"; do
            echo "Construyendo $service..."
            PATH_TO_BUILD=$([[ "$service" == "frontend" ]] && echo "./frontend" || echo "./backend/$service")
            docker build -t $service $PATH_TO_BUILD
            docker tag $service:latest ${{ secrets.ECR_REGISTRY }}/$service:latest
            docker push ${{ secrets.ECR_REGISTRY }}/$service:latest
          done

      # --- CORRECCIÓN: ESCANEO DE SEGURIDAD (IE3) ---
      - name: Ejecutar Snyk para escanear dependencias
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
        continue-on-error: false

      - name: Despliegue remoto en EC2 vía SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd ~/colegio",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker-compose -f docker-compose.prod.yml pull",
              "docker-compose -f docker-compose.prod.yml up -d"
            ]'